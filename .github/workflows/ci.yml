name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test Spring Boot application
        working-directory: backend
        run: mvn --batch-mode --update-snapshots clean test package

      - name: Build and test Java Function App
        if: ${{ !cancelled() }}
        working-directory: function-app
        run: bash ./mvnw --batch-mode clean test package

      - name: Publish Spring Boot test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Spring Boot tests
          path: backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          use-actions-summary: 'true'

      - name: Publish Function App test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Azure Function tests
          path: function-app/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          use-actions-summary: 'true'

      - name: Upload raw JUnit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: |
            backend/target/surefire-reports/
            function-app/target/surefire-reports/
          if-no-files-found: warn

      - name: Upload Spring Boot artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: backend/target/food-ordering-backend.jar
          if-no-files-found: error

      - name: Upload Azure Function artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-function-package
          path: function-app/target/azure-functions/food-order-function
          if-no-files-found: error 
