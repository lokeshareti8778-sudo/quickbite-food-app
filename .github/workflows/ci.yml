name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test Spring Boot application
        working-directory: backend
        run: mvn --batch-mode --update-snapshots clean test package

      - name: Build and test Java Function App
        working-directory: function-app
        run: mvn --batch-mode clean test package

      - name: Upload Spring Boot artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: backend/target/food-ordering-backend.jar
          if-no-files-found: error

      - name: Upload Azure Function artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-function-package
          path: function-app/target/azure-functions/food-ordering-function
          if-no-files-found: error 
