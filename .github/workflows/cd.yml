name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}

    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Download Spring Boot artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar
          path: deployment/backend
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download Azure Function artifact
        uses: actions/download-artifact@v4
        with:
          name: azure-function-package
          path: deployment/function-app
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure resource group
        run: |
          az group show \
            --name "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --only-show-errors \
            --output none

      - name: Deploy Spring Boot to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: deployment/backend/food-ordering-backend.jar 

      - name: Deploy Java Function to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: deployment/function-app
